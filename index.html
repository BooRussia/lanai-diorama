<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanai Diorama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; title plate top-left, compact control dock bottom-center, compass top-right. */
:root{
  --bg1:#e3e7ea; --bg2:#c4ccd2;
  --ink:#23282d; --muted:#5f6871;
  --panel:rgba(248,247,244,.88); --line:rgba(35,40,45,.14);
  --accent:#3a3f44; --accent-ink:#f6f3ec; --chip:rgba(35,40,45,.06);
  --sun:#d98c2b; --solid:#f8f7f4;
  --display:'Marcellus','Trajan Pro',Georgia,serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg1:#262d34; --bg2:#12161a; --ink:#ebe6dc; --muted:#9ba4ac;
  --panel:rgba(22,26,30,.86); --line:rgba(235,230,220,.14);
  --accent:#d9cdb5; --accent-ink:#1b1712; --chip:rgba(235,230,220,.07); --sun:#eba44a; --solid:#16191d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg1:#262d34; --bg2:#12161a; --ink:#ebe6dc; --muted:#9ba4ac;
  --panel:rgba(22,26,30,.86); --line:rgba(235,230,220,.14);
  --accent:#d9cdb5; --accent-ink:#1b1712; --chip:rgba(235,230,220,.07); --sun:#eba44a; --solid:#16191d; color-scheme:dark }
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg2);background-image:radial-gradient(120% 90% at 50% 35%,var(--bg1),var(--bg2));
  color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.plate{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(18px,calc(env(safe-area-inset-left,0px) + 18px));max-width:min(360px,calc(100vw - 100px));pointer-events:none}
.plate h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.2vw,34px);letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
.plate p{margin:6px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.02em;line-height:1.45}
.dial{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:148px;height:148px;border-radius:50%;
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.14);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .track{fill:none;stroke:var(--line);stroke-width:6;stroke-linecap:round}
.dial .fill{fill:none;stroke:var(--sun);stroke-width:6;stroke-linecap:round}
.dial .tick{stroke:var(--muted);stroke-width:1.2;stroke-linecap:round}
.dial .knob{fill:var(--sun);stroke:var(--solid);stroke-width:3;cursor:grab;outline:none}
.dial .knob:focus-visible{stroke:var(--ink)}
.dial .knob.moon{fill:#c9d4ec}
.dial .fill{opacity:.9}
.dial .end{font:600 8.5px var(--body);fill:var(--muted);letter-spacing:.08em}
#core{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;border:1px solid var(--line);background:var(--chip);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
#core:hover{border-color:var(--muted)}
#core .t{font:600 14px var(--body);font-variant-numeric:tabular-nums;letter-spacing:.01em}
#core .r{font:500 9px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
#core[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#core[aria-pressed="true"] .r{color:var(--accent-ink);opacity:.75}
#core:focus-visible,.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.edit{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(330px,calc(100vw - 260px));min-width:200px;box-sizing:border-box;
  padding:12px 14px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:7px}
.edit-title{font-family:var(--display);font-size:17px;letter-spacing:.02em;line-height:1.15}
.edit-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.4}
.edit-keys{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.edit-keys span{white-space:nowrap}
kbd{font:600 10px var(--body);display:inline-block;min-width:16px;text-align:center;padding:2px 4px;margin-right:2px;border-radius:4px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.edit-btns{display:flex;flex-wrap:wrap;gap:6px}
.edit-btns button{font:500 12px var(--body);color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.edit-btns button:hover:not(:disabled){border-color:var(--line)}
.edit-btns button:disabled{opacity:.45;cursor:default}
.edit-btns button[aria-pressed="true"]{background:var(--sun);color:#1b140d}
.edit-btns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#layoutText{width:100%;height:90px;box-sizing:border-box;font:11px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;resize:vertical}
@media (max-width:620px){ .edit-keys{display:none} .edit{width:calc(100vw - 230px)} }
.reset{position:fixed;right:calc(max(18px,calc(env(safe-area-inset-right,0px) + 18px)) + 156px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;padding:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.reset:hover{border-color:var(--muted)}
.reset svg{width:17px;height:17px}
.compass{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));top:calc(env(safe-area-inset-top,0px) + 18px);width:46px;height:46px;pointer-events:none}
.compass svg{width:100%;height:100%}
.hint{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));top:calc(env(safe-area-inset-top,0px) + 72px);font-size:11px;color:var(--muted);text-align:right;line-height:1.5;pointer-events:none}
.plate,.hint{transition:color .6s}
.is-night .plate h1{color:#f3efe6}.is-night .plate p,.is-night .hint{color:rgba(243,239,230,.72)}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
@media (max-width:620px){ .hint{display:none} }
</style>
</head>
<body>


<div id="stage"></div>
<div class="plate">
  <h1>Lanai Diorama</h1>
  <p>Steel-and-glass arched loggia on a floating slice of pool deck. Turn the dial to spin the sky through a full day.</p>
</div>
<div class="compass" aria-hidden="true"><svg viewBox="-23 -23 46 46"><circle r="21" fill="var(--panel)" stroke="var(--line)"/><g id="needle"><path d="M0-15 L5 2 L0 -1 L-5 2Z" fill="var(--ink)"/><path d="M0 15 L5 2 L0 -1 L-5 2Z" fill="var(--muted)" opacity=".45"/><text y="-17" text-anchor="middle" font-size="6.5" fill="var(--ink)" font-family="Instrument Sans,sans-serif" font-weight="600">POOL</text></g></svg></div>
<div class="hint">Drag to orbit<br>Scroll or pinch to zoom<br>Right-drag to pan</div>
<button class="reset" id="reset" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
<div class="edit" id="edit" role="region" aria-label="Furniture editor">
  <div class="edit-title" id="selName">Arrange furniture</div>
  <div class="edit-meta" id="selMeta"></div>
  <div class="edit-keys"><span><kbd>Drag</kbd> move</span><span><kbd>R</kbd> rotate dial</span><span><kbd>Q</kbd><kbd>E</kbd> turn 15°</span><span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> nudge</span><span><kbd>Shift</kbd> fine</span><span><kbd>Esc</kbd> done</span></div>
  <div class="edit-btns"><button id="rotBtn" aria-pressed="false" disabled>Rotate</button><button id="copyBtn">Copy layout</button><button id="resetLayout">Reset layout</button></div>
  <textarea id="layoutText" hidden readonly aria-label="Layout data"></textarea>
</div>
<div class="dial" id="dial">
  <svg viewBox="-74 -74 148 148">
    <path class="track" id="track"/>
    <path class="fill" id="fillArc"/>
    <g id="ticks"></g>
    <circle class="knob" id="knob" r="9" tabindex="0" role="slider" aria-label="Time of day" aria-valuemin="0" aria-valuemax="24"/>
  </svg>
  <button id="core" aria-pressed="false" title="Remove the roof to see inside"><span class="t" id="time">6:15 pm</span><span class="r" id="roofLbl">Remove roof</span></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    const skyU = {
      uSunDir: { value: new THREE.Vector3(0, 1, 0) },

    /* ============================================================ STARS */
    const starRng = makeRng(0x5ea51de);

  }

/* ---------- geometry helpers ---------- */
function rrShape(w,h,r){const s=new THREE.Shape();const x=-w/2,y=-h/2;r=Math.max(0.0005,Math.min(r,w/2,h/2));
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}
function rbox(w,h,d,r,seg=4){r=Math.min(r,w*0.45,h*0.45,d*0.45);const iw=Math.max(w-2*r,0.002),ih=Math.max(h-2*r,0.002),id=Math.max(d-2*r,0.002);
  const g=new THREE.ExtrudeGeometry(rrShape(iw,ih,r*0.8),{depth:id,bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:seg,curveSegments:5});g.translate(0,0,-id/2);return g;}
function mesh(g,m,pos,rot,parent,cast=true,recv=true){const o=new THREE.Mesh(g,m);if(pos)o.position.set(pos[0],pos[1],pos[2]);if(rot)o.rotation.set(rot[0]||0,rot[1]||0,rot[2]||0);o.castShadow=cast;o.receiveShadow=recv;(parent||scene).add(o);return o;}
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
function frustum(bw,bd,tw,td,h){const g=new THREE.BoxGeometry(1,h,1);const p=g.attributes.position;for(let i=0;i<p.count;i++){const top=p.getY(i)>0;p.setX(i,p.getX(i)*(top?tw:bw));p.setZ(i,p.getZ(i)*(top?td:bd));}g.computeVertexNormals();return g;}
function worldBox(x0,x1,y0,y1,z0,z1,mats){const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  const p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);let u,v;
    if(Math.abs(n.getY(i))>0.5){u=x/2.4;v=-z/2.4;}else if(Math.abs(n.getX(i))>0.5){u=z/2;v=(y+1.1)/1.1;}else{u=x/2;v=(y+1.1)/1.1;}uv.setXY(i,u,v);}
  const m=new THREE.Mesh(g,mats);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
function polyMesh(faces,mat,uvf,parent){const pos=[],uv=[];faces.forEach(f=>{for(let i=1;i<f.length-1;i++)[f[0],f[i],f[i+1]].forEach(v=>{pos.push(v[0],v[1],v[2]);uv.push(...uvf(v));});});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}

/* arches */
function archGeom(w,spr,rise){const hw=w/2,r=(hw*hw+rise*rise)/(2*rise);return {r,cy:spr+rise-r};}
function archY(w,spr,rise,u){const a=archGeom(w,spr,rise);return a.cy+Math.sqrt(Math.max(0,a.r*a.r-u*u));}
function archPts(w,b,spr,rise,inset=0,seg=30){const {r,cy}=archGeom(w,spr,rise);const ri=r-inset,hx=w/2-inset;const ys=cy+Math.sqrt(ri*ri-hx*hx);
  const a0=Math.atan2(ys-cy,hx),a1=Math.PI-a0;const pts=[[-hx,b+inset],[hx,b+inset],[hx,ys]];
  for(let i=1;i<seg;i++){const a=a0+(a1-a0)*i/seg;pts.push([Math.cos(a)*ri,cy+Math.sin(a)*ri]);}pts.push([-hx,ys]);return pts;}
function holePts(op){const us=op.units.slice().sort((a,b)=>a.c-b.c);const L=us[0].c-us[0].w/2,Rt=us[us.length-1].c+us[us.length-1].w/2;
  const pts=[[L,op.b],[Rt,op.b]];
  for(let k=us.length-1;k>=0;k--){const u=us[k];const a=archPts(u.w,op.b,op.spr,op.rise);a.slice(k===us.length-1?2:3).forEach(p=>pts.push([p[0]+u.c,p[1]]));}
  return pts;}
const v2=(pts,dx=0)=>pts.map(p=>new THREE.Vector2(p[0]+dx,p[1]));

const RIM=(function(){const n=200,pts=[];for(let i=0;i<n;i++){const th=Math.PI/2-i/n*Math.PI*2;   /* clockwise seen from above */
  const j=0.024*Math.sin(th*5+1.3)+0.018*Math.sin(th*11+0.4)+0.012*Math.sin(th*23+2.2)+(hsh(i)-0.5)*0.03+((hsh(i*3+7)>0.9)?-0.03:0);
  const r=GC.r*(1+j);pts.push([GC.cx+Math.cos(th)*r,GC.cz+Math.sin(th)*r]);}return pts;})();
/* lawn texture */
const lawnTex=(function(){const [c,g]=cv(512);g.fillStyle='#4f7a34';g.fillRect(0,0,512,512);

  for(let i=0;i<16000;i++){const x=R()*512,y=R()*512,l=rr(22,48);g.strokeStyle=`hsl(${rr(78,108)},${rr(35,58)}%,${l}%)`;g.lineWidth=rr(0.6,1.4);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+rr(-2.5,2.5),y-rr(3,8));g.stroke();}
  grain(g,512,512,10);const t=T(c,1/2.2,1/2.2);return t;})();

    rows.forEach(([o,y,c])=>{pos.push(x+ux*o,GC.top+y,z+uz*o);col.push(c.r,c.g,c.b);});}
  for(let i=0;i<n;i++)for(let r=0;r<2;r++){const a=i*3+r,b=a+1,c=a+3,d=c+1;idx.push(a,c,b,b,c,d);}
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));lg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));

  surf.rotation.x=-Math.PI/2;surf.position.set((POOL.x0+POOL.x1)/2,WY,(POOL.z0+POOL.z1)/2);surf.renderOrder=2;surf.userData.helper=true;scene.add(surf);
  function sizeRT(){const s=new THREE.Vector2();renderer.getDrawingBufferSize(s);rt.setSize(Math.max(256,Math.round(s.x*0.5)),Math.max(256,Math.round(s.y*0.5)));}
  sizeRT();addEventListener('resize',sizeRT);
  const _p=new THREE.Vector3(0,WY,0),_n=new THREE.Vector3(0,1,0),_c=new THREE.Vector3(),_v=new THREE.Vector3(),_t=new THREE.Vector3(),_l=new THREE.Vector3(),_r=new THREE.Matrix4();
  function renderReflection(){
    _p.set(surf.position.x,WY,surf.position.z);_c.setFromMatrixPosition(camera.matrixWorld);
    _v.subVectors(_p,_c);if(_v.dot(_n)>0){surf.material.uniforms.uOn.value=0;return;}surf.material.uniforms.uOn.value=1;
    _v.reflect(_n).negate().add(_p);
    _r.extractRotation(camera.matrixWorld);_l.set(0,0,-1).applyMatrix4(_r).add(_c);
    _t.subVectors(_p,_l).reflect(_n).negate().add(_p);
    vCam.position.copy(_v);vCam.up.set(0,1,0).applyMatrix4(_r).reflect(_n);vCam.lookAt(_t);
    vCam.far=camera.far;vCam.near=camera.near;vCam.updateMatrixWorld();vCam.projectionMatrix.copy(camera.projectionMatrix);vCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
    texM.set(0.5,0,0,0.5, 0,0.5,0,0.5, 0,0,0.5,0.5, 0,0,0,1).multiply(vCam.projectionMatrix).multiply(vCam.matrixWorldInverse).multiply(surf.matrixWorld);
    surf.visible=false;poolMeshes.forEach(m=>m.visible=false);
    const prevRT=renderer.getRenderTarget(),prevAuto=renderer.shadowMap.autoUpdate,prevClip=renderer.clippingPlanes;
    renderer.shadowMap.autoUpdate=false;renderer.clippingPlanes=[rPlane];
    renderer.setRenderTarget(rt);renderer.clear();renderer.render(scene,vCam);
    renderer.setRenderTarget(prevRT);renderer.clippingPlanes=prevClip;renderer.shadowMap.autoUpdate=prevAuto;
    surf.visible=true;poolMeshes.forEach(m=>m.visible=true);}

  /* ---- sunlight caustics dancing on the pool floor ---- */
  const caust={value:1},ctime={value:0};
  scene.traverse(o=>{if(!o.isMesh||!o.material||Array.isArray(o.material))return;const m=o.material;
    if(!(o.geometry&&o.geometry.type==='PlaneGeometry'&&Math.abs(o.position.y-(POOL.y+0.002))<0.01))return;
    m.onBeforeCompile=sh=>{sh.uniforms.uCaust=caust;sh.uniforms.uCT=ctime;
      sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vCW;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvCW=(modelMatrix*vec4(transformed,1.0)).xyz;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
        varying vec3 vCW;uniform float uCaust,uCT;
        float caus(vec2 p,float t){vec2 i=p;float c=1.0,inten=0.005;
          for(int n=0;n<4;n++){float tt=t*(1.0-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
            c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}
          c/=4.0;c=1.17-pow(c,1.4);return pow(abs(c),8.0);}`)
        .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\ntotalEmissiveRadiance+=vec3(0.62,0.86,0.95)*clamp(caus(vCW.xz*2.4,uCT*0.55),0.0,1.4)*0.32*uCaust;');};
    m.needsUpdate=true;});

  /* ---- soft contact shadows where walls meet the floor ---- */
  const [ac,ag]=cv(4,64);const gr=ag.createLinearGradient(0,0,0,64);gr.addColorStop(0,'rgba(20,16,10,.5)');gr.addColorStop(0.35,'rgba(20,16,10,.2)');gr.addColorStop(1,'rgba(20,16,10,0)');ag.fillStyle=gr;ag.fillRect(0,0,4,64);
  const aoTex=new THREE.CanvasTexture(ac);
  const aoMat=new THREE.MeshBasicMaterial({map:aoTex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2,toneMapped:false});
  function ao(ax,az,bx,bz,nx,nz,y,w){const g=new THREE.BufferGeometry();
    const P=[ax,y,az, bx,y,bz, bx+nx*w,y,bz+nz*w, ax+nx*w,y,az+nz*w];
    g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute([0,1,1,1,1,0,0,0],2));
    const cross=(bx-ax)*nz-(bz-az)*nx;g.setIndex(cross>0?[0,2,1,0,3,2]:[0,1,2,0,2,3]);
    const m=new THREE.Mesh(g,aoMat);m.renderOrder=1;m.userData.helper=true;m.raycast=()=>{};scene.add(m);}
  const iy=Y0+0.003,iw=0.38,LX0=RX0+TH,LX1=RX1-TH,LZ0=RZ0+TH,LZ1=RZ1-TH;
  ao(KX,LZ0,LX1,LZ0,0,1,iy,iw);ao(LX0,KW,KX,KW,0,1,iy,iw);ao(KX,LZ0,KX,KW,1,0,iy,iw);
  ao(LX0,LZ1,LX1,LZ1,0,-1,iy,iw);ao(LX1,LZ0,LX1,LZ1,-1,0,iy,iw);ao(LX0,KW,LX0,LZ1,1,0,iy,iw);
  const ey=0.004,ew=0.5;
  ao(RX0,RZ1,RX1+0.15,RZ1,0,1,ey,ew);ao(RX0,RZ1,RX0,5.7,1,0,ey,ew);ao(PX0,5.7,RX0,5.7,0,1,ey,ew);
  ao(RX1,WZ1+0.22,RX1,RZ1,1,0,ey,ew);ao(RX1,WZ1+0.22,PX1,WZ1+0.22,0,1,ey,ew);

  /* ---- warm glow halos around every light, fading in at dusk ---- */
  const [hc,hg]=cv(128);const hgr=hg.createRadialGradient(64,64,0,64,64,64);
  hgr.addColorStop(0,'rgba(255,236,200,1)');hgr.addColorStop(0.18,'rgba(255,214,150,.55)');hgr.addColorStop(0.5,'rgba(255,180,100,.12)');hgr.addColorStop(1,'rgba(255,170,90,0)');
  hg.fillStyle=hgr;hg.fillRect(0,0,128,128);
  const haloMat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hc),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:0});
  const halo=(parent,s)=>{const sp=new THREE.Sprite(haloMat);sp.scale.set(s,s,1);sp.userData.helper=true;sp.raycast=()=>{};parent.add(sp);};
  spots.forEach(s=>halo(s,0.55));lampLights.forEach(l=>halo(l,l.distance&&l.distance<=3.5?0.6:0.9));

  return {
    update(L,t){ctime.value=t;surf.material.uniforms.uTime.value=t;
      const n=Math.min(1,Math.max(0,L?L.night:0));caust.value=(1-n)*0.95+0.05;haloMat.opacity=n*0.85;
      if(L){surf.material.uniforms.uSun.value.copy(L.sunDir);surf.material.uniforms.uSunI.value=Math.min(1.4,L.keyIntensity);}
      renderReflection();}};
})();

function homeView(){const k=innerWidth/innerHeight<0.9?1.7:1;camera.position.set(21*k,10.5*k,33*k);controls.target.set(0,-0.8,1.4);controls.update();}
$('reset').addEventListener('click',homeView);
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();homeView();

const needle=$('needle'),clock=new THREE.Clock(),pA=new THREE.Vector3(),pB=new THREE.Vector3(),fwd=new THREE.Vector3(0,0,1);
function frame(){const dt=Math.min(clock.getDelta(),0.05);controls.update();
  stepRoof();stepTime(dt);updateSky(dt,clock.elapsedTime);RQ.update(lastL,clock.elapsedTime);
  if(fanOn&&!reduce)blades.rotation.y+=dt*3.2;
  pA.copy(controls.target).project(camera);pB.copy(controls.target).add(fwd).project(camera);
  const ang=Math.atan2(-(pB.y-pA.y)*innerHeight,(pB.x-pA.x)*innerWidth);needle.setAttribute('transform',`rotate(${ang*180/Math.PI+90})`);
  renderer.render(scene,camera);requestAnimationFrame(frame);}
frame();
})();
